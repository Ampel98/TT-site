<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= 顶部导航 ================= -->
<header>
  <nav>
    <ul>
      <li><a href="index.html"   class="nav-link active">Home</a></li>
      <li><a href="profile.html" class="nav-link">Profile</a></li>
      <li><a href="video.html"   class="nav-link">Video</a></li>

  <form class="nav-search" action="search.html" method="get">

</header>

<!-- ================= 首页轮播 ================= -->
<main style="flex:1;">
  <div class="home-hero" id="homeHero">

    <div class="hero-slide active"
         style="background-image:url('https://s3.bmp.ovh/2026/10/11/vCCX1P9U.jpg'); background-position: 70% 25%;"></div>

    <div class="hero-slide"
         style="background-image:url('https://s3.bmp.ovh/2026/10/11/lTWJAnA6.jpg');"></div>

    <div class="hero-slide"
         style="background-image:url('https://s3.bmp.ovh/2026/10/11/wndF5FqG.jpg');"></div>

    <div class="hero-slide"
         style="background-image:url('https://s3.bmp.ovh/2026/10/11/XrKkyY13.jpg'); background-position: 65% 25%;"></div>

    <div class="hero-caption"></div>

    <div class="hero-dots" id="heroDots"></div>
  </div>
</main>

<!-- ================= 轮播脚本 ================= -->
<script>
(function () {
  const slides = document.querySelectorAll('.home-hero .hero-slide');
  const dotsBox = document.getElementById('heroDots');
  if (!slides.length) return;

  let current = 0;
  const INTERVAL = 5000;

  // 生成指示点
  slides.forEach((_, i) => {
    const dot = document.createElement('span');
    if (i === 0) dot.classList.add('active');
    dot.addEventListener('click', () => {
      goTo(i);
      resetTimer();
    });
    dotsBox.appendChild(dot);
  });

  const dots = dotsBox.querySelectorAll('span');

  function goTo(index) {
    slides[current].classList.remove('active');
    dots[current].classList.remove('active');
    current = index;
    slides[current].classList.add('active');
    dots[current].classList.add('active');
  }

  let timer = setInterval(() => goTo((current + 1) % slides.length), INTERVAL);

  function resetTimer() {
    clearInterval(timer);
    timer = setInterval(() => goTo((current + 1) % slides.length), INTERVAL);
  }
})();
</script>

</body>
</html>
