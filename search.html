<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTT | 搜索</title>
<link rel="icon" type="image/png" href="https://s3.bmp.ovh/2026/11/09/zETcj11E.jpg">
<link rel="preconnect" href="https://fonts.loli.net">
<link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.search-wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 150px 20px 80px;
}

/* ===== 搜索与筛选区 ===== */
.filter-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 50px;
}

.search-bar {
  width: 100%;
  max-width: 500px;
  display: flex;
  background: #151515;
  border: 1px solid #333;
  border-radius: 30px;
  padding: 6px;
  margin-bottom: 30px;
  transition: border-color 0.3s;
}
.search-bar:focus-within { border-color: #b9a06a; }
.search-bar input {
  flex: 1;
  background: transparent;
  border: none;
  padding: 12px 24px;
  color: #fff;
  font-size: 15px;
  outline: none;
}
.search-bar input::placeholder { color: #666; }
.search-bar button {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: none;
  background: #b9a06a;
  color: #111;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.3s;
}
.search-bar button:hover { opacity: 0.8; }

/* 分类胶囊按钮 */
.filter-tags {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
}
.tag-btn {
  background: transparent;
  color: #a0a0a0;
  border: 1px solid #444;
  padding: 8px 24px;
  border-radius: 30px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.2s;
}
.tag-btn:hover {
  border-color: #b9a06a;
  color: #b9a06a;
}
.tag-btn.active {
  background: #b9a06a;
  color: #111;
  border-color: #b9a06a;
  font-weight: bold;
}

/* ===== 结果列表 ===== */
.search-result-title {
  color: #888;
  font-size: 14px;
  letter-spacing: 2px;
  margin-bottom: 20px;
  text-align: left;
}
.search-empty {
  color: #888;
  text-align: center;
  padding: 60px 0;
  font-size: 15px;
}

.search-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 30px;
  align-items: start;
}

.search-card {
  display: block;
  transition: transform 0.3s ease;
  text-decoration: none;
  width: 100%;
  max-width: 280px;
}
.search-card:hover { transform: translateY(-5px); }

.search-card .poster {
  width: 100%;
  aspect-ratio: 4/5;
  overflow: hidden;
  border-radius: 8px;
  box-shadow: 0 12px 25px rgba(0,0,0,0.5);
  margin-bottom: 10px;
  background: #1e1e1e;
  display: flex;
  align-items: center;
  justify-content: center;
}
.search-card .poster img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.search-card .name {
  color: #e0e0e0;
  font-size: 14px;
  text-align: center;
  letter-spacing: 1px;
}
.search-card .type {
  color: #888;
  font-size: 12px;
  text-align: center;
  margin-top: 4px;
}

.poster-empty {
  color: #666;
  font-size: 13px;
  letter-spacing: 2px;
}

/* ===== 分页器 ===== */
.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-top: 50px;
  padding-bottom: 20px;
}
.page-btn {
  background: transparent;
  color: #a0a0a0;
  border: 1px solid #444;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.2s;
}
.page-btn:hover {
  border-color: #b9a06a;
  color: #b9a06a;
}
.page-btn.active {
  background: #b9a06a;
  color: #111;
  border-color: #b9a06a;
  font-weight: bold;
}
.page-dots {
  color: #888;
  padding: 0 4px;
}

/* ===== 响应式 ===== */
@media (max-width: 1024px) {
  .search-grid { grid-template-columns: repeat(3, 1fr); gap: 20px; }
}
@media (max-width: 768px) {
  .search-wrap { padding: 140px 16px 60px; }
  .search-grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .search-card .name { font-size: 13px; }
  .search-card .type { font-size: 11px; }
  .filter-tags { gap: 8px; }
  .tag-btn { padding: 6px 16px; font-size: 13px; }
}
@media (max-width: 480px) {
  .search-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .search-card .name { font-size: 12px; letter-spacing: 0; }
}
</style>
</head>
<body>

<header>
  <nav>
    <ul>
      <li><a href="index.html"   class="nav-link">Home</a></li>
      <li><a href="profile.html" class="nav-link">Profile</a></li>
      <li><a href="video.html"   class="nav-link">Video</a></li>
      <li><a href="music.html"   class="nav-link">Music</a></li>
      <li><a href="gallery.html" class="nav-link">Gallery</a></li>
    </ul>
  </nav>

  <form class="nav-search" id="navSearchForm" action="search.html" method="get">
    <svg class="nav-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
    </svg>
    <input type="text" name="q" id="navSearchInput" placeholder="搜索" autocomplete="off">
  </form>
</header>

<main class="search-wrap">
  <div class="filter-container">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="搜索你想找的内容..." autocomplete="off">
      <button id="searchBtn">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>
      </button>
    </div>

    <div class="filter-tags" id="categoryTags"></div>
  </div>

  <div id="searchResults"></div>
</main>

</html>
